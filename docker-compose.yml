version: '3.8'

services:
  planner:
    build: .
    container_name: polymer-planner
    ports:
      - "127.0.0.1:3000:3000" # Публикуйте сайт только через HTTPS reverse proxy.
    volumes:
      # ВАЖНО: Укажи здесь пути к папкам, где лежат БД и загрузки.
      # Формат: ./локальная_папка:/app/путь_в_контейнере
      - ./data:/app/data       # Папка для файла SQLite (например, database.sqlite)
      - ./uploads:/app/uploads # Папка для загруженных через multer файлов
    env_file:
      - .env # Подключение файла переменных окружения (если есть)
    environment:
      NODE_ENV: production
      DB_PATH: /app/data/im_doe.sqlite
      TRUST_PROXY: "1"
      DOE_ANALYTICS_MODE: http
      DOE_ANALYTICS_URL: http://analytics-r:8000
      DOE_ANALYTICS_TIMEOUT_MS: "15000"
    restart: unless-stopped

  analytics-r:
    build:
      context: ./analytics-r
    container_name: polymer-planner-analytics
    expose:
      - "8000"
    restart: unless-stopped
