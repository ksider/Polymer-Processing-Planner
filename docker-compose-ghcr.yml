version: '3.8'

services:
  planner:
    image: ghcr.io/ksider/polymer-planner:latest
    container_name: polymer-planner
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_PATH: /app/data/im_doe.sqlite
      TRUST_PROXY: "1"
      DOE_ANALYTICS_MODE: http
      DOE_ANALYTICS_URL: http://analytics-r:8000
      DOE_ANALYTICS_TIMEOUT_MS: "15000"
    volumes:
      - planner_data:/app/data
      - planner_uploads:/app/uploads
    restart: unless-stopped

  analytics-r:
    image: ghcr.io/ksider/polymer-planner-analytics:latest
    container_name: polymer-planner-analytics
    expose:
      - "8000"
    restart: unless-stopped

volumes:
  planner_data:
  planner_uploads:
